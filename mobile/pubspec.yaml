name: beereddy_mobile
description: Beereddy Agency ERP Mobile App for Retailers, Drivers, and Admins (V Bond Tile Adhesives)
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  dio: ^5.4.0
  flutter_riverpod: ^2.4.9
  go_router: ^13.1.0
  shared_preferences: ^2.2.2
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  flutter_secure_storage: ^9.0.0
  image_picker: ^1.0.7
  file_picker: ^8.0.0
  permission_handler: ^11.3.0
  printing: ^5.11.1
  pdf: ^3.10.7
  cached_network_image: ^3.3.1
  connectivity_plus: ^5.0.2
  firebase_messaging: ^14.7.19
  intl: ^0.19.0
  google_fonts: ^6.1.0
  flutter_spinkit: 5.2.0
  webview_flutter: ^4.10.0
  cupertino_icons: ^1.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
