<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Beereddy ERP" />
    <meta name="theme-color" content="#0f172a" />
    <meta name="description" content="Beereddy Agency ERP - Executive Distributor & Retailer Command Center for V Bond Tile Adhesives" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="manifest" href="/manifest.json" />
    <title>Beereddy Agency ERP | Enterprise Distributor & Retailer Portal</title>
  </head>
  <body>
    <!-- Branded PWA Splash Screen (Fades out when React mounts) -->
    <div id="pwa-splash-screen" style="position: fixed; inset: 0; z-index: 9999; background: #0f172a; display: flex; flex-direction: column; align-items: center; justify-content: center; color: #ffffff; font-family: 'Plus Jakarta Sans', sans-serif; transition: opacity 400ms ease, visibility 400ms ease;">
      <div style="width: 80px; height: 80px; border-radius: 20px; background: linear-gradient(135deg, #2563eb, #1d4ed8); display: flex; align-items: center; justify-content: center; box-shadow: 0 10px 25px rgba(37, 99, 235, 0.4); margin-bottom: 20px;">
        <svg width="42" height="42" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
      </div>
      <h1 style="font-size: 24px; font-weight: 800; margin: 0; letter-spacing: -0.5px; color: #ffffff;">Beereddy Agency</h1>
      <p style="font-size: 12px; font-weight: 600; color: #94a3b8; margin-top: 6px; letter-spacing: 0.5px; text-transform: uppercase;">A Trusted V Bond Distributor</p>
      <div style="margin-top: 24px; width: 32px; height: 32px; border: 3px solid #2563eb; border-top-color: transparent; border-radius: 50%; animation: pwa-spin 1s linear infinite;"></div>
      <style>
        @keyframes pwa-spin { to { transform: rotate(360deg); } }
      </style>
    </div>

    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    <script>
      // Hide Splash Screen once React app mounts
      window.addEventListener('DOMContentLoaded', () => {
        setTimeout(() => {
          const splash = document.getElementById('pwa-splash-screen');
          if (splash) {
            splash.style.opacity = '0';
            splash.style.visibility = 'hidden';
            setTimeout(() => splash.remove(), 400);
          }
        }, 500);
      });

      // Register Service Worker
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js')
            .then((reg) => console.log('✅ PWA Service Worker registered:', reg.scope))
            .catch((err) => console.warn('Service Worker registration warning:', err));
        });
      }
    </script>
  </body>
</html>
