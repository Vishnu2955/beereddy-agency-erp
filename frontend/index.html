<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Beereddy ERP" />
    <meta name="theme-color" content="#0f172a" />
    <meta name="description" content="Beereddy Agency ERP - Executive Distributor & Retailer Command Center for V Bond Tile Adhesives" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="manifest" href="/manifest.json" />
    <title>Beereddy Agency ERP | Enterprise Distributor & Retailer Portal</title>
  </head>
  <body>
    <!-- Branded PWA Splash Screen with V-BOND Logo -->
    <div id="pwa-splash-screen" style="position: fixed; inset: 0; z-index: 9999; background: #0f172a; display: flex; flex-direction: column; align-items: center; justify-content: center; color: #ffffff; font-family: 'Plus Jakarta Sans', sans-serif; transition: opacity 400ms ease, visibility 400ms ease;">
      <div style="width: 84px; height: 84px; border-radius: 22px; background: #0f172a; border: 2px solid rgba(255,255,255,0.1); display: flex; align-items: center; justify-content: center; box-shadow: 0 12px 30px rgba(0, 0, 0, 0.5); margin-bottom: 20px; overflow: hidden; padding: 6px;">
        <img src="/icon-192.png" alt="Beereddy V-Bond Logo" style="width: 100%; height: 100%; object-fit: contain;" />
      </div>
      <h1 style="font-size: 24px; font-weight: 800; margin: 0; letter-spacing: -0.5px; color: #ffffff;">Beereddy Agency</h1>
      <p style="font-size: 12px; font-weight: 600; color: #94a3b8; margin-top: 6px; letter-spacing: 0.5px; text-transform: uppercase;">A Trusted V Bond Distributor</p>
      <div style="margin-top: 24px; width: 32px; height: 32px; border: 3px solid #2563eb; border-top-color: transparent; border-radius: 50%; animation: pwa-spin 1s linear infinite;"></div>
      <style>
        @keyframes pwa-spin { to { transform: rotate(360deg); } }
      </style>
    </div>

    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    <script>
      // Hide Splash Screen once React app mounts
      window.addEventListener('DOMContentLoaded', () => {
        setTimeout(() => {
          const splash = document.getElementById('pwa-splash-screen');
          if (splash) {
            splash.style.opacity = '0';
            splash.style.visibility = 'hidden';
            setTimeout(() => splash.remove(), 400);
          }
        }, 300);
      });

      // PWA Service Worker Registration with Automatic Update Refresh
      if ('serviceWorker' in navigator) {
        let refreshing = false;
        navigator.serviceWorker.addEventListener('controllerchange', () => {
          if (!refreshing) {
            refreshing = true;
            console.log("⚡ New Service Worker activated. Reloading page for updated content...");
            window.location.reload();
          }
        });

        window.addEventListener('load', async () => {
          try {
            const registration = await navigator.serviceWorker.register('/sw.js', { updateViaCache: 'none' });
            console.log('✅ Service Worker registered successfully:', registration.scope);

            if (registration.waiting) {
              registration.waiting.postMessage({ type: 'SKIP_WAITING' });
            }

            registration.addEventListener('updatefound', () => {
              const newWorker = registration.installing;
              if (!newWorker) return;
              newWorker.addEventListener('statechange', () => {
                if (newWorker.state === 'installed' && navigator.serviceWorker.controller) {
                  registration.waiting?.postMessage({ type: 'SKIP_WAITING' });
                }
              });
            });

            if (navigator.serviceWorker.controller) {
              navigator.serviceWorker.controller.postMessage({ type: 'SKIP_WAITING' });
            }
          } catch (err) {
            console.warn('Service Worker registration warning:', err);
          }
        });
      }
    </script>
  </body>
</html>
