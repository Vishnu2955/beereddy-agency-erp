<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Beereddy ERP" />
    <meta name="theme-color" content="#0f172a" />
    <meta name="description" content="Beereddy Agency ERP - Executive Distributor & Retailer Command Center for V Bond Tile Adhesives" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="manifest" href="/manifest.json" />
    <title>Beereddy Agency ERP | Enterprise Distributor & Retailer Portal</title>
  </head>
  <body>
    <!-- Branded PWA Splash Screen with V-BOND Logo -->
    <div id="pwa-splash-screen" style="position: fixed; inset: 0; z-index: 9999; background: #0f172a; display: flex; flex-direction: column; align-items: center; justify-content: center; color: #ffffff; font-family: 'Plus Jakarta Sans', sans-serif; transition: opacity 400ms ease, visibility 400ms ease;">
      <div style="width: 84px; height: 84px; border-radius: 22px; background: #0f172a; border: 2px solid rgba(255,255,255,0.1); display: flex; align-items: center; justify-content: center; box-shadow: 0 12px 30px rgba(0, 0, 0, 0.5); margin-bottom: 20px; overflow: hidden; padding: 6px;">
        <img src="/icon-192.png" alt="Beereddy V-Bond Logo" style="width: 100%; height: 100%; object-fit: contain;" />
      </div>
      <h1 style="font-size: 24px; font-weight: 800; margin: 0; letter-spacing: -0.5px; color: #ffffff;">Beereddy Agency</h1>
      <p style="font-size: 12px; font-weight: 600; color: #94a3b8; margin-top: 6px; letter-spacing: 0.5px; text-transform: uppercase;">A Trusted V Bond Distributor</p>
      <!-- 3D Isometric Block Assembly Loader -->
      <div className="loader" style="margin-top: 10px; transform: scale(0.6);">
        <div class="box box0"><div></div></div>
        <div class="box box1"><div></div></div>
        <div class="box box2"><div></div></div>
        <div class="box box3"><div></div></div>
        <div class="box box4"><div></div></div>
        <div class="box box5"><div></div></div>
        <div class="box box6"><div></div></div>
        <div class="box box7"><div></div></div>
        <div class="ground"><div></div></div>
      </div>
    </div>

    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    <script>
      // Hide Splash Screen once React app mounts
      window.addEventListener('DOMContentLoaded', () => {
        setTimeout(() => {
          const splash = document.getElementById('pwa-splash-screen');
          if (splash) {
            splash.style.opacity = '0';
            splash.style.visibility = 'hidden';
            setTimeout(() => splash.remove(), 400);
          }
        }, 300);
      });

      // Global Early PWA Install Prompt Handler
      window.deferredPwaPrompt = null;
      window.addEventListener('beforeinstallprompt', (e) => {
        e.preventDefault();
        window.deferredPwaPrompt = e;
        console.log('📲 Early beforeinstallprompt event captured on window!');
      });

      // PWA Service Worker Registration with Automatic Update Refresh
      if ('serviceWorker' in navigator) {
        let refreshing = false;
        navigator.serviceWorker.addEventListener('controllerchange', () => {
          if (!refreshing) {
            refreshing = true;
            console.log("⚡ New Service Worker activated. Reloading page for updated content...");
            window.location.reload();
          }
        });

        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js')
            .then((reg) => {
              console.log('✅ PWA Service Worker registered:', reg.scope);
              reg.onupdatefound = () => {
                const installingWorker = reg.installing;
                if (installingWorker) {
                  installingWorker.onstatechange = () => {
                    if (installingWorker.state === 'installed' && navigator.serviceWorker.controller) {
                      console.log('🔄 New version detected! Triggering skipWaiting...');
                      installingWorker.postMessage({ type: 'SKIP_WAITING' });
                    }
                  };
                }
              };
            })
            .catch((err) => console.warn('Service Worker registration error:', err));
        });
      }
    </script>
  </body>
</html>
